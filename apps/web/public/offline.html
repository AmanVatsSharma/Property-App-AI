<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — KonKreet</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080c14;color:rgba(255,255,255,0.7);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .card{background:#161d2e;border:1px solid rgba(255,255,255,0.06);border-radius:22px;padding:48px 40px;max-width:440px;width:100%}
    .icon{font-size:56px;margin-bottom:20px}
    h1{font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.5px;margin-bottom:10px}
    p{font-size:15px;line-height:1.65;margin-bottom:28px}
    a{display:inline-block;background:#00d4aa;color:#080c14;font-weight:700;padding:13px 32px;border-radius:100px;text-decoration:none;font-size:15px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. KonKreet will be right back.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
