<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — UrbanNest.ai</title>
<style>
  body { font-family: system-ui, sans-serif; background: #080c14; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
  .card { background: #0f1623; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 48px 40px; max-width: 400px; }
  h1 { font-size: 28px; margin-bottom: 12px; }
  p { color: rgba(255,255,255,0.5); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
  a { display: inline-block; padding: 12px 28px; background: #00d4aa; color: #080c14; border-radius: 100px; font-weight: 700; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:52px;margin-bottom:20px">🏠</div>
  <h1>You're offline</h1>
  <p>Please check your connection and try again. Your saved searches are available when you reconnect.</p>
  <a href="/" onclick="location.reload()">Try again</a>
</div>
</body>
</html>
